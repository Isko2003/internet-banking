<header class="flex items-center justify-between h-16 px-6 bg-card border-b border-line">
  <button (click)="onMenuClick()" class="text-xl text-ink-muted hover:text-ink">☰</button>
  <div class="font-bold text-lg text-mint">MyBank</div>
  <div class="flex items-center gap-4">
    @if (unreadCount() > 0) {
      <span class="bg-expense text-white text-xs rounded-full px-1.5 py-0.5">{{
        unreadCount()
      }}</span>
    }
    <span class="text-sm text-ink-muted">{{ displayName() }}</span>
    <button (click)="onLogout()" class="text-sm text-red-500 hover:text-red-400">Logout</button>
  </div>
</header>
