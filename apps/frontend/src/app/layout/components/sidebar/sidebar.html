<aside
  class="fixed md:static top-0 left-0 h-full w-64 bg-card border-r border-line transform transition-transform duration-200 z-20"
  [class.-translate-x-full]="!isOpen"
  [class.translate-x-0]="isOpen"
>
  <nav class="flex flex-col gap-1 p-4">
    <a
      routerLink="/dashboard"
      routerLinkActive="bg-mint-light dark:bg-navy-light text-navy dark:text-mint"
      class="px-3 py-2 rounded-md text-ink-muted hover:bg-page"
      >Home</a
    >

    <a
      routerLink="/accounts"
      routerLinkActive="bg-mint-light dark:bg-navy-light text-navy dark:text-mint"
      class="px-3 py-2 rounded-md text-ink-muted hover:bg-page"
      >Accounts</a
    >

    <a
      routerLink="/cards"
      routerLinkActive="bg-mint-light dark:bg-navy-light text-navy dark:text-mint"
      class="px-3 py-2 rounded-md text-ink-muted hover:bg-page"
      >Cards</a
    >

    <a
      routerLink="/transactions"
      routerLinkActive="bg-mint-light dark:bg-navy-light text-navy dark:text-mint"
      class="px-3 py-2 rounded-md text-ink-muted hover:bg-page"
      >Transactions</a
    >

    <a
      routerLink="/transfers"
      routerLinkActive="bg-mint-light dark:bg-navy-light text-navy dark:text-mint"
      class="px-3 py-2 rounded-md text-ink-muted hover:bg-page"
      >Transfers</a
    >

    <a
      routerLink="/payments"
      routerLinkActive="bg-mint-light dark:bg-navy-light text-navy dark:text-mint"
      class="px-3 py-2 rounded-md text-ink-muted hover:bg-page"
      >Payments</a
    >

    <a
      routerLink="/templates"
      routerLinkActive="bg-mint-light dark:bg-navy-light text-navy dark:text-mint"
      class="px-3 py-2 rounded-md text-ink-muted hover:bg-page"
      >Templates</a
    >

    <a
      routerLink="/analytics"
      routerLinkActive="bg-mint-light dark:bg-navy-light text-navy dark:text-mint"
      class="px-3 py-2 rounded-md text-ink-muted hover:bg-page"
      >Analytics</a
    >

    <a
      routerLink="/notifications"
      routerLinkActive="bg-mint-light dark:bg-navy-light text-navy dark:text-mint"
      class="px-3 py-2 rounded-md text-ink-muted hover:bg-page"
      >Notifications</a
    >

    <a
      routerLink="/profile"
      routerLinkActive="bg-mint-light dark:bg-navy-light text-navy dark:text-mint"
      class="px-3 py-2 rounded-md text-ink-muted hover:bg-page"
    >
      Profile
    </a>

    <a
      routerLink="/settings"
      routerLinkActive="bg-mint-light dark:bg-navy-light text-navy dark:text-mint"
      class="px-3 py-2 rounded-md text-ink-muted hover:bg-page"
      >Settings</a
    >
  </nav>
</aside>
