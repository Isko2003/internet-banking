<div class="flex flex-col gap-4 font-body">
  <div class="flex items-center justify-between">
    <h1 class="font-display text-2xl font-bold text-ink">Bildirişlər</h1>

    @if (unreadCount() > 0) {
      <button (click)="onMarkAllAsRead()" class="text-sm text-mint hover:underline">
        Hamısını oxunmuş et ({{ unreadCount() }})
      </button>
    }
  </div>

  <div class="bg-card rounded-xl border border-line-light shadow-sm p-4 flex flex-wrap gap-3">
    <select
      [ngModel]="typeFilter()"
      (ngModelChange)="typeFilter.set($event)"
      class="px-3 py-2 border border-line rounded-md text-sm"
    >
      <option value="all">Bütün Bildirişlər</option>
      <option value="transaction">Tranzaksiya</option>
      <option value="info">Məlumat</option>
      <option value="card">Kart</option>
      <option value="security">Təhlükəsizlik</option>
    </select>

    <select
      [ngModel]="readFilter()"
      (ngModelChange)="readFilter.set($event)"
      class="px-3 py-2 border border-line rounded-md text-sm"
    >
      <option value="all">Hamısı</option>
      <option value="unread">Oxunmamış</option>
      <option value="read">Oxunmuş</option>
    </select>
  </div>

  @if (filteredNotifications().length === 0) {
    <div class="bg-card rounded-xl border border-line-light shadow-sm p-8 text-center">
      <p class="text-sm text-ink-faint">Bildiriş tapılmadı</p>
    </div>
  } @else {
    <div class="flex flex-col gap-3">
      @for (notification of filteredNotifications(); track notification.id) {
        <div
          class="bg-card rounded-xl border border-line-light shadow-sm p-4 flex items-start justify-between gap-3"
        >
          <div class="flex items-start gap-3 flex-1">
            <span
              class="w-2 h-2 rounded-full mt-1.5 flex-shrink-0"
              [class.bg-mint]="!notification.read"
              [class.bg-line]="notification.read"
            ></span>
            <div class="flex-1">
              <p class="text-sm text-ink-muted" [class.font-medium]="!notification.read">
                {{ notification.message }}
              </p>
              <p class="text-xs text-ink-faint mt-0.5">{{ notification.date }}</p>
            </div>
          </div>

          <div class="flex gap-2 flex-shrink-0">
            @if (!notification.read) {
              <button
                (click)="onMarkAsRead(notification.id)"
                class="text-xs text-mint hover:underline"
              >
                Oxunmuş et
              </button>
            }
            <button
              (click)="onDelete(notification.id)"
              class="text-xs text-ink-faint hover:text-expense"
            >
              Sil
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
