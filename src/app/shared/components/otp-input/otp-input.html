<div class="flex gap-2">
  @for (digit of digits; track $index) {
    <input
      #digitInput
      type="text"
      inputmode="numeric"
      maxlength="1"
      [value]="digit"
      (input)="onDigitInput($index, $event)"
      class="w-12 h-12 text-center text-lg border border-gray-200 rounded-md focus:outline-none focus:ring-2 focus:ring-mint"
    />
  }
</div>
