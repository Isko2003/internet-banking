<div class="fixed bottom-4 right-4 flex flex-col gap-2 z-50">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="px-4 py-3 rounded-lg shadow-md text-sm text-white flex items-center justify-between gap-3 min-w-[240px]"
      [class.bg-mint]="toast.variant === 'success'"
      [class.bg-expense]="toast.variant === 'error'"
      [class.bg-navy]="toast.variant === 'info'"
    >
      <span>{{ toast.message }}</span>
      <button (click)="toastService.dismiss(toast.id)" class="text-white/70 hover:text-white">
        ✕
      </button>
    </div>
  }
</div>
