<div class="flex flex-col gap-4 font-body max-w-lg">
    <h1 class="font-display text-2xl font-bold text-navy">Başqa istifadəçiyə köçürmə</h1>

    <form [formGroup]="transferUserForm" class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 flex flex-col gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="debitAccountId">Debit hesab</label>
            <select formControlName="debitAccountId" class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm">
                <option [ngValue]="null">Secin</option>
                @for (account of accounts(); track account.id) {
                    <option [ngValue]="account.id">{{account.name}} {{account.balance}} {{account.currency}}</option>
                }
            </select>
        </div>

        <div class="flex gap-4">
            <label class="flex items-center gap-2 text-sm">
                <input type="radio" formControlName="recipientType" value="card" />
                    Kart nömrəsi
            </label>
            <label class="flex items-center gap-2 text-sm">
                <input type="radio" formControlName="recipientType" value="iban" />
                    IBAN
            </label>
        </div>

        @if(transferUserForm.value.recipientType === 'card') {
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="cardNumber">Kart nömrəsi</label>
                <input
                    formControlName="recipientIdentifier"
                    (input)="onCardNumberInput($event)"
                    placeholder="0000 0000 0000 0000"
                    class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm"
                    maxlength="19"
                />
                @if (transferUserForm.value.recipientIdentifier) {
                    <p class="text-xs text-gray-400 mt-1">
                        {{ detectBank(transferUserForm.value.recipientIdentifier!) }}
                    </p>
                }
            </div>
        } @else {
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="iban">IBAN</label>
                <input 
                    formControlName="recipientIdentifier"
                    placeholder="AZ00XXXX00000000000000000000"
                    class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm"
                    maxlength="34"
                 />
            </div>
        }
    </form>
</div>
