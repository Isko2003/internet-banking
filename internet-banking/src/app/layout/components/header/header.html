<header class="flex items-center justify-between h-16 px-6 bg-white border-b border-gray-200">
  <button (click)="onMenuClick()" class="text-xl text-gray-600 hover:text-gray-900">☰</button>
  <div class="font-bold text-lg text-blue-600">MyBank</div>
  <div class="flex items-center gap-4">
    @if (unreadCount() > 0) {
      <span class="bg-expense text-white text-xs rounded-full px-1.5 py-0.5">{{
        unreadCount()
      }}</span>
    }
    <span class="text-sm text-gray-700">{{ displayName() }}</span>
    <button (click)="onLogout()" class="text-sm text-red-500 hover:text-red-700">Logout</button>
  </div>
</header>
